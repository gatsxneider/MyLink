<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="mailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with subtle border -->
  <rect width="80" height="80" rx="22" fill="url(#mailBg)" />
  <rect width="78" height="78" x="1" y="1" rx="21" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Envelope Shadow/Backing -->
  <g transform="translate(18, 22)">
    <rect x="0" y="4" width="44" height="30" rx="6" fill="#ffffff" fill-opacity="0.15" />
    <!-- Main Envelope body -->
    <path d="M4 6C4 3.79086 5.79086 2 8 2H36C38.2091 2 40 3.79086 40 6V28C40 30.2091 38.2091 32 36 32H8C5.79086 32 4 30.2091 4 28V6Z" 
          fill="#ffffff" />
    <!-- Flap Fold Line -->
    <path d="M5 4L22 19L39 4" 
          stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M5 30L16 18" 
          stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <path d="M39 30L28 18" 
          stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
</svg>

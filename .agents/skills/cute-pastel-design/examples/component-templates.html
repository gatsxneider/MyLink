<!--
  Cute Pastel & Soft Sky UI Component Templates
  - 밝고 귀여운 파스텔 크림 & 소프트 하늘색 디자인 컴포넌트 템플릿 모음
-->

<!-- 1. 프로필 섹션 템플릿 -->
<header class="profile-section" aria-label="프로필 정보">
  <div class="profile-avatar-frame" role="region" aria-label="프로필 아바타">
    <div class="profile-slider">
      <img src="assets/images/avatar.jpg" alt="프로필 사진" class="profile-slide active">
    </div>
  </div>
  <div class="profile-indicators" role="tablist">
    <button type="button" class="indicator-dot active" role="tab" aria-selected="true"></button>
    <button type="button" class="indicator-dot" role="tab" aria-selected="false"></button>
  </div>
  <h1 class="profile-name">
    이름
    <span class="badge-symbol">✦</span>
  </h1>
  <p class="profile-bio">부드러운 파스텔톤 한줄 소개</p>
</header>

<!-- 2. 링크 카드 템플릿 -->
<a href="https://example.com" class="link-card" target="_blank" rel="noopener noreferrer">
  <div class="link-thumb-wrapper">
    <img src="assets/images/icon.jpg" alt="아이콘" class="link-thumb">
  </div>
  <div class="link-content">
    <div class="link-title">서비스 이름</div>
    <div class="link-description">귀엽고 깔끔한 설명 문구</div>
  </div>
  <div class="link-arrow" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </div>
</a>

<!-- 3. 최신 소식 팝업 모달 템플릿 -->
<div id="newsModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <button type="button" class="modal-x-btn" id="modalCloseIconBtn" aria-label="팝업 닫기">&times;</button>
    <div class="modal-badge">
      <span class="modal-badge-icon">✨</span> 소식 배지
    </div>
    <h2 id="modalTitle" class="modal-title">소식 제목</h2>
    <p class="modal-description">상세한 안내 문구가 들어갑니다.</p>
    <div class="modal-actions">
      <button type="button" class="modal-close-btn" id="modalCloseBtn">닫기</button>
    </div>
  </div>
</div>
